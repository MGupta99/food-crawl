[project]
name = "food-crawl"
version = "0.1.0"
description = "Focused crawler and curation pipeline for a Chicago restaurant food-blog text corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
chi-food-seeds = "crawler.seeds.cli:main"
chi-food-frontier = "crawler.frontier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated Alembic revision scripts follow the tool's own template/style.
extend-exclude = ["crawler/frontier/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
